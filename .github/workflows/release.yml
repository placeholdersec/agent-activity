name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Version matches the tag
        run: |
          v=$(python -c "import re,sys; print(re.search(r'^VERSION = \"([^\"]+)\"', open('source/collect.py').read(), re.M).group(1))")
          test "v$v" = "$GITHUB_REF_NAME"
      - name: agent-activity.py is built from source/
        run: |
          python source/bundle.py
          git diff --exit-code agent-activity.py
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Checksums and notes
        run: |
          sha256sum agent-activity.py > SHA256SUMS
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" agent-activity.py SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
