name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux, Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: agent-activity.py is built from source/
        run: |
          python source/bundle.py
          git diff --exit-code agent-activity.py
      - name: Tests
        run: python -m unittest discover -s tests -v

  macos:
    name: macOS, system Python
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python version
        run: /usr/bin/python3 --version
      - name: Tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Runs as shipped
        run: sh agent-activity.py --help
